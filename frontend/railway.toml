[build]
builder = "RAILPACK"
# Railpack installs dependencies automatically during its install phase.
# Running npm ci again here tries to remove the cached /app/node_modules mount
# and can fail with EBUSY (for example /app/node_modules/.vite).
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
